[project]
name = "vigiles"
version = "0.1.0"
description = "Fire protection maintenance and monitoring platform - integration workshop project"
requires-python = ">=3.12,<3.13"
dependencies = ["vigiles-common", "vigiles-registry", "vigiles-field-app", "vigiles-hub", "vigiles-gateway", "vigiles-importer", "vigiles-dev-issuer"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "pytest-httpserver>=1.1",
    "pyyaml>=6",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*", "tools/*"]

[tool.uv.sources]
vigiles-common = { workspace = true }
vigiles-registry = { workspace = true }
vigiles-importer = { workspace = true }
vigiles-field-app = { workspace = true }
vigiles-hub = { workspace = true }
vigiles-gateway = { workspace = true }
vigiles-dev-issuer = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra --import-mode=importlib"
pythonpath = ["tests"]
markers = [
    "unit: fast tests without external dependencies",
    "component: tests that need PostgreSQL 16 and/or Mosquitto 2",
    "e2e: end-to-end scenarios on the full stack",
    "chaos: failure scenarios on the full stack",
]
