name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -m unit

  component:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGPASSWORD: ci-postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install Mosquitto
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends mosquitto
      - name: Create .env and database roles
        run: |
          sed 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-postgres/' .env.example > .env
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -v registry_app_password=change-me-registry \
            -v importer_password=change-me-importer \
            -v hub_app_password=change-me-hub \
            -f infra/postgres/init.sql
      - run: uv sync --locked
      - run: uv run pytest -m component
      - name: End-to-end and failure tests on local processes
        run: uv run pytest -m "e2e or chaos"

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Secrets and Keycloak realm
        run: python3 scripts/gen_secrets.py
      - run: sudo chmod -R a+rwX data
      - name: Start the full stack
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Smoke test (S1, S4, Keycloak tokens)
        run: scripts/compose_smoke.sh
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
