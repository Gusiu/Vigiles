[project]
name = "vigiles-common"
version = "0.1.0"
description = "Shared building blocks for Vigiles services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.16.2",
    "structlog>=26.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigiles_common"]
