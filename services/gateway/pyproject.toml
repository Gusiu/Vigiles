[project]
name = "vigiles-gateway"
version = "0.1.0"
description = "IoT gateway simulator: devices of two fictional vendors, store-and-forward buffer, Last Will"
requires-python = ">=3.12,<3.13"
dependencies = ["vigiles-common", "uvicorn>=0.32"]

[project.scripts]
vigiles-gateway = "vigiles_gateway.app:main"

[tool.uv.sources]
vigiles-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigiles_gateway"]
