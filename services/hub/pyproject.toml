[project]
name = "vigiles-hub"
version = "0.1.0"
description = "Integration hub: normalises, enriches, routes and aggregates device messages"
requires-python = ">=3.12,<3.13"
dependencies = ["vigiles-common", "httpx>=0.27", "uvicorn>=0.32", "psycopg-pool>=3.2"]

[project.scripts]
vigiles-hub = "vigiles_hub.app:main"
vigiles-hub-migrate = "vigiles_hub.app:migrate"

[tool.uv.sources]
vigiles-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigiles_hub"]
