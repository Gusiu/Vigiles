[project]
name = "vigiles-importer"
version = "0.1.0"
description = "File transfer: loads contractor asset lists (CSV) and site configuration (JSON) into the registry"
requires-python = ">=3.12,<3.13"
dependencies = ["vigiles-common", "pydantic>=2.9"]

[project.scripts]
vigiles-import = "vigiles_importer.cli:main"

[tool.uv.sources]
vigiles-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigiles_importer"]
