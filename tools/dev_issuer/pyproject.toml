[project]
name = "vigiles-dev-issuer"
version = "0.1.0"
description = "Local stand-in for Keycloak: signs tokens of the same structure. Never used in compose."
requires-python = ">=3.12,<3.13"
dependencies = ["vigiles-common", "uvicorn>=0.32", "python-multipart>=0.0.12"]

[project.scripts]
vigiles-dev-issuer = "vigiles_dev_issuer.app:main"

[tool.uv.sources]
vigiles-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigiles_dev_issuer"]
